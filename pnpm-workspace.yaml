packages:
  - durable-execution
  - durable-execution-orpc-utils
  - durable-execution-storage-test-utils
  - durable-execution-storage-drizzle
  - durable-execution-storage-convex
  - durable-execution-storage-convex/test

# Only simple-git-hooks needs its install script, to install the git hooks. The others only check
# or fetch a native binary that a platform package already has, or build an optional native addon
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  simple-git-hooks: true
  ssh2: false
  unrs-resolver: false
strictDepBuilds: true

catalogs:
  prod:
    '@gpahal/std': ^0.0.49
    '@standard-schema/spec': ^1.1.0
    '@standard-schema/utils': ^0.3.0
    nanoid: ^6.0.2
    superjson: ^2.2.6
  dev:
    '@changesets/cli': ^3.0.3
    '@edge-runtime/vm': ^5.0.0
    '@gpahal/eslint-config': ^0.0.142
    '@gpahal/prettier-config': ^0.0.46
    '@gpahal/tsconfig': ^0.0.24
    '@ianvs/prettier-plugin-sort-imports': ^4.7.1
    '@libsql/client': ^0.18.0
    '@orpc/client': ^1.16.1
    '@orpc/contract': ^1.16.1
    '@orpc/server': ^1.16.1
    '@testcontainers/mysql': ^12.2.1
    '@testcontainers/postgresql': ^12.2.1
    '@types/node': ^24.19.2
    '@types/pg': ^8.23.1
    '@vitest/coverage-v8': ^5.0.5
    '@vitest/eslint-plugin': ^1.6.28
    convex: ^1.48.0
    drizzle-kit: ^0.31.11
    drizzle-orm: ^0.45.4
    effect: ^4.0.6
    eslint: ^10.13.0
    eslint-plugin-turbo: ^2.11.10
    mysql2: ^3.24.6
    npm-run-all2: ^9.0.4
    pg: ^8.23.1
    premove: ^4.0.0
    prettier: ^3.9.10
    simple-git-hooks: ^2.14.0
    testcontainers: ^12.2.1
    tsup: ^9.0.0
    tsx: ^4.23.15
    turbo: ^2.11.10
    typedoc: ^0.28.20
    typedoc-plugin-mermaid: ^1.12.0
    typescript: ~6.0.3
    vitest: ^5.0.5

minimumReleaseAgeExclude:
  - '@gpahal/eslint-config@0.0.142'
